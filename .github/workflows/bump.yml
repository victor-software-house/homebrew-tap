name: Bump

# Points a cask or a formula at a release.
# A release job sends a repository_dispatch of type release.
# Its payload has four values: the cask or the formula, the tag, the repository
# of the release and its asset. A formula names one asset per line, one for
# each platform. A manual run takes the same values.
#
# The shared workflow checks the digest of each asset. It then opens and
# auto-merges the pull request as the Version Packages App.
# The default branch takes changes only through a pull request.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      cask:
        description: The cask to bump, Casks/<cask>.rb; set cask or formula
        type: string
        default: ""
      formula:
        description: The formula to bump, Formula/<formula>.rb; set cask or formula
        type: string
        default: ""
      tag:
        description: The release tag, such as v0.0.1
        type: string
        required: true
      repository:
        description: The release's repository, as owner/name
        type: string
        required: true
      asset:
        description: The release asset's file name; a formula takes one per line
        type: string
        required: true

permissions:
  contents: read

# A newer release of a cask or formula supersedes a bump still running for it.
# Different casks and formulae do not wait on each other.
#
# A formula's group carries a formula- prefix, as the shared workflow's does.
# So a cask and a formula of the same name never share a group.
# The shared workflow queues its own runs in a group of its own.
# A "-caller" suffix keeps this group apart from it.
concurrency:
  group: >-
    ${{ github.workflow }}-caller-${{ github.event.client_payload.cask || inputs.cask
    || format('formula-{0}', github.event.client_payload.formula || inputs.formula) }}
  cancel-in-progress: true

jobs:
  bump:
    permissions:
      contents: read
    uses: victor-software-house/actions/.github/workflows/homebrew-bump.yml@1c7fb4ca1e0acfffa1af42cf289e7ccb74588bff # main, 2026-11-26
    with:
      cask: ${{ github.event.client_payload.cask || inputs.cask }}
      formula: ${{ github.event.client_payload.formula || inputs.formula }}
      tag: ${{ github.event.client_payload.tag || inputs.tag }}
      source-repository: ${{ github.event.client_payload.repository || inputs.repository }}
      asset: ${{ github.event.client_payload.asset || inputs.asset }}
      runner: ubuntu-26.04
    secrets:
      CHANGESET_VERSION_APP_CLIENT_ID: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      CHANGESET_VERSION_APP_PRIVATE_KEY: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}

